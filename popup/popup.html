<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>漫卷 SlowScroll</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="ss-aurora" aria-hidden="true"></div>

  <div class="popup">
    <!-- ============ Header ============ -->
    <header class="popup-header">
      <div class="popup-header__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v16" />
          <path d="m7.5 8.5 4.5-4.5 4.5 4.5" />
          <path d="m7.5 15.5 4.5 4.5 4.5-4.5" />
        </svg>
      </div>
      <div class="popup-header__text">
        <h1 class="popup-header__title">漫卷</h1>
        <span class="popup-header__sub">SlowScroll</span>
      </div>
      <span class="badge badge--dot" id="stateBadge">待机</span>
    </header>

    <!-- ============ Hero · 状态与进度 ============
         打开 popup 的第一诉求是「现在滚到哪了」，因此把状态文字
         与进度合成一个视觉主角，而不是平铺成两个等权重小卡片。 -->
    <section class="hero" aria-labelledby="stateText">
      <div class="hero__head">
        <span class="hero__state" id="stateText" role="status" aria-live="polite">已停止</span>
        <span class="hero__pct ss-mono" id="progressPercent">0%</span>
      </div>

      <!-- 进度条本体走 track + fill 双层，fill 宽度由 CSS 变量驱动 -->
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" aria-label="滚动进度" id="progressBar">
        <div class="progress__fill" id="progressFill"></div>
      </div>

      <p class="hero__remaining" id="progressRemaining">剩余 0 px</p>

      <!-- 容器失败原因：把「点了没反应」变成有解释 -->
      <p class="hero__issue" id="containerIssue" hidden></p>
    </section>

    <!-- ============ Primary Controls ============ -->
    <div class="popup-actions">
      <button id="startStop" class="btn btn--primary popup-actions__main" type="button" aria-pressed="false">
        <svg class="icon-play" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
          <path d="M8 5.2v13.6a1 1 0 0 0 1.53.85l10.6-6.8a1 1 0 0 0 0-1.7L9.53 4.35A1 1 0 0 0 8 5.2Z" />
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2.2" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
          <rect x="7" y="5" width="3.6" height="14" rx="1.4" />
          <rect x="13.4" y="5" width="3.6" height="14" rx="1.4" />
        </svg>
        <span id="startStopLabel">开始滚动</span>
      </button>

      <button id="pauseResume" class="btn btn--glass popup-actions__side" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
          <rect x="7" y="5" width="3.6" height="14" rx="1.4" />
          <rect x="13.4" y="5" width="3.6" height="14" rx="1.4" />
        </svg>
        <span id="pauseResumeLabel">暂停</span>
      </button>
    </div>

    <!-- ============ Speed ============ -->
    <section class="panel">
      <div class="panel__head">
        <span class="panel__title">速度</span>
        <span class="panel__value ss-mono" id="speedLabel">600</span>
        <span class="panel__unit">px/s</span>
      </div>
      <input id="speedRange" class="slider" type="range" min="50" max="4000" step="50" value="600"
             aria-label="滚动速度" />
      <p class="panel__note" id="speedNote" hidden>手势降速中，当前实际 300 px/s</p>
    </section>

    <!-- ============ Loop ============ -->
    <section class="panel panel--row">
      <div class="panel__text">
        <span class="panel__title">到底回顶循环</span>
        <span class="panel__hint">滚到底后自动回到顶部继续</span>
      </div>
      <label class="switch">
        <input id="loopToggle" type="checkbox" />
        <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
        <span class="ss-visually-hidden">到底回顶循环</span>
      </label>
    </section>

    <!-- ============ Gesture Policy ============ -->
    <section class="panel">
      <div class="panel__head">
        <span class="panel__title">手动滚动时</span>
      </div>
      <div class="segmented" role="radiogroup" aria-label="手动滚动时的接管策略">
        <button type="button" class="segmented__item" data-policy="pause" role="radio" aria-checked="false" tabindex="0">暂停</button>
        <button type="button" class="segmented__item" data-policy="slowdown" role="radio" aria-checked="false" tabindex="-1">减速</button>
        <button type="button" class="segmented__item" data-policy="ignore" role="radio" aria-checked="false" tabindex="-1">忽略</button>
      </div>
      <p class="panel__note" id="policyHint">你一滚滚轮，滚动就停下</p>
    </section>

    <!-- ============ Range Loop · 渐进披露 ============
         区间循环是低频功能，三连按钮 + 说明文字常驻会把 popup 顶到
         浏览器 600px 上限之外（表现为末尾被裁切）。收进折叠区，
         标题行常驻可见状态，展开后才显示操作。 -->
    <details class="disclosure" id="rangeDisclosure">
      <summary class="disclosure__summary">
        <span class="disclosure__title">区间循环</span>
        <span class="disclosure__status" id="rangeStatus">未设置</span>
        <svg class="disclosure__chevron" viewBox="0 0 24 24" width="14" height="14"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </summary>

      <div class="disclosure__body">
        <p class="panel__note panel__note--lead">
          先滚到想反复读的段落开头标记起点，再滚到结尾标记终点
        </p>
        <div class="range-actions">
          <button type="button" class="btn btn--ghost range-actions__btn" id="markStart">标记起点</button>
          <button type="button" class="btn btn--ghost range-actions__btn" id="markEnd">标记终点</button>
          <button type="button" class="btn btn--ghost range-actions__btn" id="clearRange">清除</button>
        </div>
        <div class="range-dwell" id="dwellRow" hidden>
          <label class="range-dwell__label" for="rangeDwell">终点停留</label>
          <input id="rangeDwell" class="slider range-dwell__slider" type="range"
                 min="0" max="10000" step="500" value="3000" aria-label="区间终点停留时长" />
          <span class="range-dwell__value ss-mono" id="rangeDwellValue">3.0s</span>
        </div>
      </div>
    </details>

    <!-- ============ 自动翻页与定时停止 · 渐进披露 ============
         两项都是「设一次、长时间不用管」的低频配置，
         常驻会把 popup 顶出600px 上限。折进同一个折叠区，
         标题行直接显示当前状态，不展开也知道开没开。 -->
    <details class="disclosure" id="autoDisclosure">
      <summary class="disclosure__summary">
        <span class="disclosure__title">自动翻页与定时停</span>
        <span class="disclosure__status" id="autoStatus">未开启</span>
        <svg class="disclosure__chevron" viewBox="0 0 24 24" width="14" height="14"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </summary>

      <div class="disclosure__body">
        <p class="panel__note panel__note--lead panel__note--warn">
          开启后扩展会在你滚到底时自动点击页面上的「下一章」。这是不可撤销的操作，请只在信任的站点使用。
        </p>

        <div class="panel panel--row panel--flush">
          <div class="panel__text">
            <span class="panel__title">触底自动翻页</span>
            <span class="panel__hint" id="autoNextHint">关闭</span>
          </div>
          <label class="switch">
            <input id="autoNextToggle" type="checkbox" />
            <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
            <span class="ss-visually-hidden">触底自动翻页</span>
          </label>
        </div>

        <div class="auto-field">
          <label class="auto-field__label" for="autoNextSites">站点白名单</label>
          <textarea id="autoNextSites" class="field-input auto-next-sites" rows="2"
                    placeholder="每行一个域名，留空 = 不限站点&#10;例：example.com"></textarea>
          <p class="panel__note">填入域名后，仅在这些站点上自动翻页</p>
        </div>

        <div class="auto-field">
          <label class="auto-field__label" for="stopAfterMinutes">倒计时到点自动停</label>
          <div class="auto-field__row">
            <input id="stopAfterMinutes" class="field-input stop-after-input" type="number"
                   min="0" max="480" step="5" value="0" />
            <span class="panel__unit">分钟</span>
            <span class="ss-mono stop-after-left" id="stopAfterLeft"></span>
          </div>
          <p class="panel__note">0 表示不限时。适合「睡前读 20 分钟」这类场景</p>
        </div>
      </div>
    </details>

    <!-- ============ Footer ============ -->
    <footer class="popup-footer">
      <span class="popup-footer__hint" id="loopCount" hidden></span>
      <button id="openOptions" class="btn btn--ghost popup-footer__link" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
        </svg>
        设置
      </button>
    </footer>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
